<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SkyApp – Celestial Star Map & Augmented Reality Planetarium</title>
  <meta name="theme-color" content="#030712">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #sky-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: grab;
    }
    #sky-canvas:active {
      cursor: grabbing;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
      display: none;
      filter: brightness(0.6) contrast(1.2);
    }
    .hud-glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .red-mode {
      filter: grayscale(1) sepia(1) hue-rotate(-50deg) saturate(5);
    }
    /* Reticle pulse */
    @keyframes reticle-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .center-reticle {
      animation: reticle-pulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- Camera video feed for AR mode -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- Sky Canvas rendering 3D celestial sphere -->
  <canvas id="sky-canvas"></canvas>

  <!-- Center Crosshair Reticle -->
  <div class="pointer-events-none absolute inset-0 z-20 flex items-center justify-center">
    <div class="center-reticle w-16 h-16 border border-cyan-400/40 rounded-full flex items-center justify-center">
      <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
    </div>
  </div>

  <!-- Top Navigation & Status Bar -->
  <header class="absolute top-0 left-0 right-0 z-30 p-4 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-3 hud-glass px-4 py-2 rounded-2xl shadow-lg">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-cyan-500/20">
        ✨
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide uppercase text-cyan-300">SkyApp Planetarium</h1>
        <p id="time-display" class="text-xs text-gray-400 font-mono">Calculating Sidereal Time...</p>
      </div>
    </div>

    <!-- Search & Quick Toggles -->
    <div class="pointer-events-auto flex items-center gap-2">
      <!-- Search Input -->
      <div class="relative">
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search stars (Sirius, Orion...)" 
          class="hud-glass px-3 py-1.5 pl-8 text-xs rounded-xl focus:outline-none focus:ring-1 focus:ring-cyan-400 w-48 transition-all"
        />
        <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-2.5"></i>
        <div id="search-results" class="hidden absolute top-full left-0 right-0 mt-1 hud-glass rounded-xl overflow-hidden shadow-2xl z-40 max-h-48 overflow-y-auto"></div>
      </div>

      <!-- AR Camera Toggle -->
      <button id="toggle-camera" class="hud-glass p-2 rounded-xl text-gray-300 hover:text-cyan-400 hover:border-cyan-400/50 transition-colors" title="Toggle AR Camera Mode">
        <i data-lucide="camera" class="w-4 h-4"></i>
      </button>

      <!-- Constellation Lines Toggle -->
      <button id="toggle-constellations" class="hud-glass p-2 rounded-xl text-cyan-400 hover:border-cyan-400/50 transition-colors" title="Toggle Constellation Lines">
        <i data-lucide="git-commit" class="w-4 h-4"></i>
      </button>

      <!-- Night / Red Light Vision Toggle -->
      <button id="toggle-night-vision" class="hud-glass p-2 rounded-xl text-gray-300 hover:text-red-400 hover:border-red-400/50 transition-colors" title="Night Vision Mode (Astromomy Filter)">
        <i data-lucide="eye" class="w-4 h-4"></i>
      </button>

      <!-- Compass / Geolocation -->
      <button id="toggle-compass" class="hud-glass p-2 rounded-xl text-gray-300 hover:text-cyan-400 hover:border-cyan-400/50 transition-colors" title="Auto Compass Sensor">
        <i data-lucide="compass" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Bottom Coordinates & Tonight's Sky Info -->
  <footer class="absolute bottom-0 left-0 right-0 z-30 p-4 flex flex-col sm:flex-row items-end sm:items-center justify-between gap-3 pointer-events-none">
    <!-- Live Coordinates readout -->
    <div class="pointer-events-auto hud-glass px-3.5 py-2 rounded-xl text-xs font-mono text-gray-300 flex items-center gap-4">
      <div><span class="text-gray-500">AZ:</span> <span id="azimuth-val" class="text-cyan-300">000°</span></div>
      <div><span class="text-gray-500">ALT:</span> <span id="altitude-val" class="text-cyan-300">+45°</span></div>
      <div><span class="text-gray-500">FOV:</span> <span id="fov-val" class="text-cyan-300">60°</span></div>
      <div id="gps-status" class="text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> GPS Active</div>
    </div>

    <!-- Quick action pill / help -->
    <div class="pointer-events-auto flex items-center gap-2">
      <button id="btn-tonights-sky" class="hud-glass px-4 py-2 rounded-xl text-xs font-medium text-cyan-300 hover:bg-cyan-500/10 flex items-center gap-2">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        Tonight's Highlights
      </button>
      <button id="btn-reset-view" class="hud-glass px-3 py-2 rounded-xl text-xs font-medium text-gray-400 hover:text-white">
        Reset
      </button>
    </div>
  </footer>

  <!-- Star Detail Modal Inspector -->
  <div id="star-modal" class="hidden absolute bottom-20 left-4 right-4 sm:left-auto sm:right-4 sm:w-96 z-40 hud-glass p-5 rounded-2xl shadow-2xl transition-all">
    <div class="flex items-start justify-between">
      <div>
        <span id="modal-con" class="text-[10px] uppercase font-bold tracking-wider text-cyan-400">Constellation</span>
        <h3 id="modal-name" class="text-lg font-bold text-white">Sirius</h3>
      </div>
      <button id="close-modal" class="p-1 rounded-lg text-gray-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <p id="modal-desc" class="text-xs text-gray-300 mt-2 leading-relaxed">Brightest star in the night sky.</p>
    <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-white/10 text-center font-mono">
      <div class="bg-black/30 p-2 rounded-lg">
        <div class="text-[10px] text-gray-400">MAGNITUDE</div>
        <div id="modal-mag" class="text-xs font-semibold text-cyan-300">-1.46</div>
      </div>
      <div class="bg-black/30 p-2 rounded-lg">
        <div class="text-[10px] text-gray-400">DISTANCE</div>
        <div id="modal-dist" class="text-xs font-semibold text-emerald-300">8.6 ly</div>
      </div>
      <div class="bg-black/30 p-2 rounded-lg">
        <div class="text-[10px] text-gray-400">SPECTRAL</div>
        <div id="modal-spectral" class="text-xs font-semibold text-purple-300">A1V</div>
      </div>
    </div>
  </div>

  <!-- Tonight's Sky Highlights Drawer -->
  <div id="tonights-drawer" class="hidden absolute inset-x-4 top-20 max-w-lg mx-auto z-40 hud-glass p-5 rounded-3xl shadow-2xl">
    <div class="flex items-center justify-between pb-3 border-b border-white/10">
      <div class="flex items-center gap-2">
        <i data-lucide="moon" class="w-5 h-5 text-cyan-400"></i>
        <h2 class="font-bold text-white text-sm">Visible Tonight in Your Sky</h2>
      </div>
      <button id="close-drawer" class="text-gray-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="tonight-list" class="mt-4 space-y-2 max-h-64 overflow-y-auto pr-1"></div>
  </div>

  <script src="stars_data.js"></script>
  <script src="app.js"></script>
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Register Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker registration error:', err));
      });
    }
  </script>
</body>
</html>
